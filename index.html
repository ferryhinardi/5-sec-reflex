<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>5-Second Reflex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1 class="game-title">5-SECOND REFLEX</h1>
            <p class="subtitle">Stop the bar in the target zone!</p>
            <div class="score-display">
                <div class="high-score">
                    <span class="label">BEST</span>
                    <span id="high-score-display">0</span>
                </div>
            </div>
            <button id="start-btn" class="btn btn-primary">START GAME</button>
            <div class="instructions">
                <p>TAP when the bar enters the green zone</p>
                <p class="small">Perfect timing = higher score</p>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <!-- HUD -->
            <div id="hud">
                <div class="hud-left">
                    <div class="stat">
                        <span class="stat-label">ROUND</span>
                        <span id="round-display">1</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">COMBO</span>
                        <span id="combo-display">0x</span>
                    </div>
                </div>
                <div class="hud-center">
                    <div class="score-large" id="score-display">0</div>
                </div>
                <div class="hud-right">
                    <div class="stat">
                        <span class="stat-label">BEST</span>
                        <span id="game-high-score">0</span>
                    </div>
                </div>
            </div>

            <!-- Canvas Container -->
            <div id="canvas-container">
                <canvas id="game-canvas"></canvas>
                
                <!-- Feedback Overlays -->
                <div id="feedback-overlay" class="feedback-overlay hidden"></div>
                <div id="streak-notification" class="streak-notification hidden"></div>
            </div>

            <!-- Ready Prompt -->
            <div id="ready-prompt" class="ready-prompt">
                <div class="ready-text">TAP TO START</div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h2 class="game-over-title">GAME OVER</h2>
            <div class="final-score-container">
                <div class="final-score-label">FINAL SCORE</div>
                <div id="final-score" class="final-score">0</div>
            </div>
            <div id="new-record" class="new-record hidden">NEW RECORD!</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="final-round">0</div>
                    <div class="stat-name">Rounds</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="final-combo">0</div>
                    <div class="stat-name">Max Combo</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="final-perfects">0</div>
                    <div class="stat-name">Perfects</div>
                </div>
            </div>
            <button id="retry-btn" class="btn btn-primary">PLAY AGAIN</button>
            <button id="menu-btn" class="btn btn-secondary">MAIN MENU</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
